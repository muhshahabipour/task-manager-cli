<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Task Manager CLI Screenshot</title>
  <desc id="desc">Illustrated terminal screenshot of the task manager board with three columns and a stats pie chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#e5e7eb"/>
  <rect x="80" y="48" width="1120" height="624" rx="22" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="80" y="48" width="1120" height="44" rx="22" fill="#1e293b"/>
  <circle cx="116" cy="70" r="7" fill="#ef4444"/>
  <circle cx="140" cy="70" r="7" fill="#f59e0b"/>
  <circle cx="164" cy="70" r="7" fill="#22c55e"/>
  <text x="640" y="76" fill="#e2e8f0" text-anchor="middle" font-size="24" font-family="Menlo, Monaco, Consolas, monospace">Task Manager CLI</text>

  <text x="120" y="132" fill="#22d3ee" font-size="18" font-family="Menlo, Monaco, Consolas, monospace">Filter: Active</text>
  <text x="320" y="132" fill="#94a3b8" font-size="18" font-family="Menlo, Monaco, Consolas, monospace">Sort: Manual</text>
  <text x="500" y="132" fill="#94a3b8" font-size="18" font-family="Menlo, Monaco, Consolas, monospace">Search: None</text>

  <g transform="translate(110 165)">
    <rect width="320" height="360" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="18" y="28" fill="#e2e8f0" font-size="20" font-family="Menlo, Monaco, Consolas, monospace">TODO 3</text>
    <rect x="14" y="56" width="292" height="48" rx="8" fill="#164e63"/>
    <text x="28" y="86" fill="#ecfeff" font-size="18" font-family="Menlo, Monaco, Consolas, monospace">Prepare release notes [H]</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="17" font-family="Menlo, Monaco, Consolas, monospace">Add stats modal [DUE 2026-05-08]</text>
    <text x="20" y="178" fill="#cbd5e1" font-size="17" font-family="Menlo, Monaco, Consolas, monospace">Review archived tasks #ops</text>
  </g>

  <g transform="translate(480 165)">
    <rect width="320" height="360" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="18" y="28" fill="#e2e8f0" font-size="20" font-family="Menlo, Monaco, Consolas, monospace">DOING 2</text>
    <rect x="14" y="56" width="292" height="48" rx="8" fill="#3f6212"/>
    <text x="28" y="86" fill="#f7fee7" font-size="18" font-family="Menlo, Monaco, Consolas, monospace">Implement search + filters</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="17" font-family="Menlo, Monaco, Consolas, monospace">Document schema upgrade path</text>
  </g>

  <g transform="translate(850 165)">
    <rect width="320" height="360" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="18" y="28" fill="#e2e8f0" font-size="20" font-family="Menlo, Monaco, Consolas, monospace">DONE 4</text>
    <rect x="14" y="56" width="292" height="48" rx="8" fill="#14532d"/>
    <text x="28" y="86" fill="#f0fdf4" font-size="18" font-family="Menlo, Monaco, Consolas, monospace">Ship modal redesign</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="17" font-family="Menlo, Monaco, Consolas, monospace">Add undo support</text>
    <text x="20" y="178" fill="#cbd5e1" font-size="17" font-family="Menlo, Monaco, Consolas, monospace">Track due dates and tags</text>
  </g>

  <g transform="translate(760 560)">
    <text x="0" y="0" fill="#e2e8f0" font-size="20" font-family="Menlo, Monaco, Consolas, monospace">Stats</text>
    <circle cx="100" cy="68" r="54" fill="none" stroke="#22d3ee" stroke-width="30" stroke-dasharray="113 226" transform="rotate(-90 100 68)"/>
    <circle cx="100" cy="68" r="54" fill="none" stroke="#eab308" stroke-width="30" stroke-dasharray="75 264" stroke-dashoffset="-113" transform="rotate(-90 100 68)"/>
    <circle cx="100" cy="68" r="54" fill="none" stroke="#22c55e" stroke-width="30" stroke-dasharray="150 189" stroke-dashoffset="-188" transform="rotate(-90 100 68)"/>
    <text x="190" y="38" fill="#22d3ee" font-size="16" font-family="Menlo, Monaco, Consolas, monospace">@@ To Do: 3</text>
    <text x="190" y="70" fill="#eab308" font-size="16" font-family="Menlo, Monaco, Consolas, monospace">@@ In Progress: 2</text>
    <text x="190" y="102" fill="#22c55e" font-size="16" font-family="Menlo, Monaco, Consolas, monospace">@@ Done: 4</text>
  </g>
</svg>
